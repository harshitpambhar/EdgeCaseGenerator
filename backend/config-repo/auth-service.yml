server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    defer-datasource-initialization: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      platform: postgres
      schema-locations: classpath:schema.sql

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 15000

app:
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-api-key-change-me}

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-must-be-at-least-32-chars-long!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_ENABLED:true}
    fetch-registry: ${EUREKA_CLIENT_ENABLED:true}
  instance:
    prefer-ip-address: true

management:
  tracing:
    export:
      zipkin:
        enabled: ${ZIPKIN_EXPORT_ENABLED:false}
