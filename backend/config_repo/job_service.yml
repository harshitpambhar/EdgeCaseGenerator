server:
  port: ${JOB_SERVICE_PORT:8083}

spring:
  datasource:
    url: ${JOB_DB_URL:jdbc:postgresql://localhost:5432/job_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_ENABLED:true}
    fetch-registry: ${EUREKA_CLIENT_ENABLED:true}
  instance:
    prefer-ip-address: true

management:
  tracing:
    export:
      zipkin:
        enabled: ${ZIPKIN_EXPORT_ENABLED:false}

docker:
  worker:
    image: ${DOCKER_WORKER_IMAGE:alpine/git:latest}
    network: ${DOCKER_WORKER_NETWORK:bridge}
    timeout-seconds: ${DOCKER_WORKER_TIMEOUT:300}
    auto-remove: true
