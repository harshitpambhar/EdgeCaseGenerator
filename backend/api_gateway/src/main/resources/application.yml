spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  main:
    web-application-type: reactive
  webflux:
    base-path: /
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Auth Service
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestIdFilter
                - name: LoggingFilter
            # User Service
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - name: RequestIdFilter
                - name: LoggingFilter
                - name: JwtAuthenticationFilter
                - name: RateLimitingFilter
            # Job Service
            - id: job-service
              uri: lb://job-service
              predicates:
                - Path=/api/jobs/**
              filters:
                - name: RequestIdFilter
                - name: LoggingFilter
                - name: JwtAuthenticationFilter
                - name: RateLimitingFilter
            # Project Service
            - id: project-service
              uri: lb://project-service
              predicates:
                - Path=/api/projects/**
              filters:
                - name: RequestIdFilter
                - name: LoggingFilter
                - name: JwtAuthenticationFilter
                - name: RateLimitingFilter
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                  - "http://localhost:8080"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                  - HEAD
                allowedHeaders:
                  - "Authorization"
                  - "Content-Type"
                  - "Accept"
                  - "X-Requested-With"
                  - "X-Request-Id"
                exposedHeaders:
                  - "Authorization"
                  - "X-Request-Id"
                  - "X-RateLimit-Remaining"
                  - "X-RateLimit-Retry-After"
                allowCredentials: false
                maxAge: 3600
          httpclient:
            ssl:
              useInsecureTrustManager: false
          httpserver:
            wiretap: false
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

server:
  port: ${API_GATEWAY_PORT:8080}
  shutdown: graceful
  netty:
    connection-timeout: 5000ms

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_ENABLED:true}
    fetch-registry: ${EUREKA_CLIENT_ENABLED:true}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.int[10000,99999]}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    export:
      zipkin:
        enabled: ${ZIPKIN_EXPORT_ENABLED:false}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-must-be-at-least-32-chars-long!!}
  expiration: ${JWT_EXPIRATION:86400}
  validation-url: ${JWT_VALIDATION_URL:http://auth-service/api/auth/validate}

# Rate Limiting Configuration
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  per-user-limit: ${RATE_LIMIT_PER_USER:1000}
  per-ip-limit: ${RATE_LIMIT_PER_IP:10000}
  window-duration-minutes: ${RATE_LIMIT_WINDOW:1}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.microservices: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss}] [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
    file: "[%d{yyyy-MM-dd HH:mm:ss}] [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-gateway.log
    max-size: 10MB
    max-history: 10
