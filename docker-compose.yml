services:
  # NOTE: Local PostgreSQL removed — all services now use shared Neon cloud DB
  # If you ever need a local DB again, uncomment the postgres service below.
  # ─── PostgreSQL (local) — DISABLED, using Neon cloud DB ──────────────────
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: postgres-db
  #   environment:
  #     POSTGRES_USER: ${DB_USERNAME:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  #     POSTGRES_DB: admin_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./backend/postgres-init:/docker-entrypoint-initdb.d:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - tcg-network
  #   restart: unless-stopped

  # ─── pgAdmin (DB viewer — connects to Neon cloud DB) ──────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
      # Tell pgAdmin where to find the pre-configured server list
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:5050"
    volumes:
      # Persist pgAdmin state (server registrations, preferences) across restarts
      - pgadmin_data:/var/lib/pgadmin
      # Pre-configure the Neon server so you never have to add it manually
      - ./backend/pgadmin-servers.json:/pgadmin4/servers.json:ro
      # Provide the DB password so pgAdmin connects without prompting
      - ./backend/pgadmin-pgpass:/pgpassfile:ro
    networks:
      - tcg-network
    restart: unless-stopped

  # ─── Redis (required by api-gateway rate limiter) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - tcg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Eureka Service Registry ──────────────────────────────────────────────
  eureka-server:
    build:
      context: ./backend/eureka_server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    networks:
      - tcg-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # ─── Config Server ────────────────────────────────────────────────────────
  config-server:
    build:
      context: ./backend/config_server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: 8888
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:///app/config-repo"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    volumes:
      - ./backend/config_repo:/app/config-repo:ro
    networks:
      - tcg-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # ─── Auth Service ─────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth_service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      AUTH_DB_URL: ${AUTH_DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: update
      SQL_INIT_MODE: always
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
      JWT_SECRET: ${JWT_SECRET:-jwt-super-secret-key-change-in-prod}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      EUREKA_CLIENT_ENABLED: "true"
      ZIPKIN_EXPORT_ENABLED: "false"
    networks:
      - tcg-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # ─── User Service ─────────────────────────────────────────────────────────
  user-service:
    build:
      context: ./backend/user_service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      USER_DB_URL: ${USER_DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: update
      SQL_INIT_MODE: always
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
      JWT_SECRET: ${JWT_SECRET:-jwt-super-secret-key-change-in-prod}
      EUREKA_CLIENT_ENABLED: "true"
      ZIPKIN_EXPORT_ENABLED: "false"
    networks:
      - tcg-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # ─── ECG analysis worker image (cloned by job-service per repo) ───────────
  ecg-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ecg-worker:latest
    entrypoint: ["/bin/sh", "-c", "echo ecg-worker image ready"]
    restart: "no"
    networks:
      - tcg-network

  # ─── Job Service ──────────────────────────────────────────────────────────
  job-service:
    build:
      context: ./backend/job-service
      dockerfile: Dockerfile
    container_name: job-service
    # Needs root (or docker group) to spawn ecg-worker containers via mounted socket
    user: "0"
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      JOB_DB_URL: ${JOB_DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: update
      EUREKA_CLIENT_ENABLED: "true"
      ZIPKIN_EXPORT_ENABLED: "false"
      ML_SERVICE_URL: http://ml-api:8000
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_WORKER_IMAGE: ecg-worker:latest
      # Use the compose project network so worker containers get proper DNS
      # The actual Docker network name is: <project_name>_tcg-network
      # Override at runtime with: COMPOSE_PROJECT_NAME=edgecasegenerator
      DOCKER_WORKER_NETWORK: ${COMPOSE_PROJECT_NAME:-edgecasegenerator}_tcg-network
      DOCKER_WORKER_TIMEOUT: 900
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tcg-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped
    depends_on:
      ecg-worker:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # ─── API Gateway ──────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend/api_gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      API_GATEWAY_PORT: 8080
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      EUREKA_CLIENT_ENABLED: "true"
      ZIPKIN_EXPORT_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - tcg-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started

  # ─── Python ML / Analysis Service ────────────────────────────────────────
  ml-api:
    build:
      context: .
      dockerfile: DockerfilePython
    container_name: ml-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      TEMP_WORKSPACE_ROOT: /tmp/ecg_workspaces
      TEST_EXECUTION_TIMEOUT: 120
      GIT_CLONE_DEPTH: 1
      MAX_FILE_SIZE_BYTES: 1048576
      PYTHONUNBUFFERED: 1
      API_GATEWAY_URL: http://api-gateway:8080
    volumes:
      - /tmp/ecg_workspaces:/tmp/ecg_workspaces
    networks:
      - tcg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started

  # ─── Frontend (React + Vite) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Must be reachable from the BROWSER, not from inside Docker
        VITE_API_URL: http://localhost:8080/api
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    networks:
      - tcg-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy

networks:
  tcg-network:
    driver: bridge

volumes:
  # Persists pgAdmin server registrations and preferences across restarts
  pgadmin_data:
    driver: local
